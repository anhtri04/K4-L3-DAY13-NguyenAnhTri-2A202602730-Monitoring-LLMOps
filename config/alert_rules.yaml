alerts:
  - name: HighLatencyP95
    severity: warning
    condition: 'percentile(response_sent.latency_ms, 95) > 3000 ms'
    duration: 5m
    type: symptom-based
    channel: slack
    owner: llmops-oncall
    runbook: docs/alerts.md#alert-1
  - name: ElevatedErrorRate
    severity: critical
    condition: 'request_failed / request_received > 2%'
    duration: 5m
    type: symptom-based
    channel: slack
    owner: llmops-oncall
    runbook: docs/alerts.md#alert-2
  - name: CostBudgetBurn
    severity: warning
    condition: 'sum(response_sent.cost_usd) over 1h > 2.5 USD'
    duration: 15m
    type: symptom-based
    channel: slack
    owner: llmops-oncall
    runbook: docs/alerts.md#alert-3
